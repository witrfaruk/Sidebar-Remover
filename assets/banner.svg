<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="100%" height="100%">
  <defs>
    <style>
      @keyframes sidebarSlide {
        0%, 20% {
          width: 180px;
          opacity: 1;
          transform: translateX(0);
        }
        38%, 80% {
          width: 0px;
          opacity: 0;
          transform: translateX(-30px);
        }
        94%, 100% {
          width: 180px;
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes contentExpand {
        0%, 20% {
          width: 535px;
          transform: translateX(0);
        }
        38%, 80% {
          width: 725px;
          transform: translateX(-190px);
        }
        94%, 100% {
          width: 535px;
          transform: translateX(0);
        }
      }

      @keyframes scrollbarFade {
        0%, 20% {
          opacity: 1;
          transform: scaleY(1);
        }
        38%, 80% {
          opacity: 0;
          transform: scaleY(0.7);
        }
        94%, 100% {
          opacity: 1;
          transform: scaleY(1);
        }
      }

      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      .neo-font-bold {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
      }
      .neo-font-mono {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-weight: 700;
      }
      .neo-font-sans {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
      }

      .anim-sidebar { animation: sidebarSlide 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-content { animation: contentExpand 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-scrollbar { animation: scrollbarFade 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .anim-badge { animation: badgePulse 2.5s ease-in-out infinite; transform-origin: 750px 30px; }
    </style>

    <!-- Clip path to guarantee zero content overflow outside inner viewport -->
    <clipPath id="viewportClip">
      <rect x="0" y="0" width="836" height="236" rx="12"/>
    </clipPath>
  </defs>

  <!-- Hard Drop Shadow (Neo-Brutalist) -->
  <rect x="26" y="24" width="836" height="300" rx="16" fill="#FF2A6D"/>
  <rect x="24" y="22" width="836" height="300" rx="16" fill="#000000"/>

  <!-- Main Window Frame -->
  <rect x="20" y="18" width="836" height="300" rx="16" fill="#12141B" stroke="#000000" stroke-width="3"/>

  <!-- Window Header Bar -->
  <rect x="20" y="18" width="836" height="52" rx="16" fill="#171922"/>
  <rect x="20" y="54" width="836" height="16" fill="#171922"/>
  <line x1="20" y1="70" x2="856" y2="70" stroke="#000000" stroke-width="2.5"/>

  <!-- Neo-Brutalist Window Dots -->
  <g transform="translate(42, 35)">
    <circle cx="0" cy="9" r="7.5" fill="#FF2A6D" stroke="#000000" stroke-width="2"/>
    <circle cx="22" cy="9" r="7.5" fill="#FFC837" stroke="#000000" stroke-width="2"/>
    <circle cx="44" cy="9" r="7.5" fill="#05FFA1" stroke="#000000" stroke-width="2"/>
  </g>

  <!-- Neo-Brutalist URL Address Bar -->
  <g transform="translate(130, 29)">
    <rect x="0" y="0" width="360" height="29" rx="8" fill="#F4F0E4" stroke="#000000" stroke-width="2"/>
    <circle cx="16" cy="14.5" r="4" fill="#12141B"/>
    <text x="29" y="19" class="neo-font-mono" font-size="11.5" fill="#000000">https://any-website.com/article</text>
  </g>

  <!-- Live Pulse Badge: SIDEBAR REMOVED -->
  <g class="anim-badge">
    <rect x="655" y="29" width="180" height="29" rx="8" fill="#FF2A6D" stroke="#000000" stroke-width="2"/>
    <circle cx="673" cy="43.5" r="4.5" fill="#05FFA1" stroke="#000000" stroke-width="1.5"/>
    <text x="686" y="48" class="neo-font-bold" font-size="11" fill="#FFFFFF" letter-spacing="1">SIDEBAR KILLED</text>
  </g>

  <!-- Inside Viewport Canvas -->
  <g transform="translate(42, 88)" clip-path="url(#viewportClip)">

    <!-- 1. Animated Sidebar (Collapses & Slides Left) -->
    <g class="anim-sidebar">
      <rect x="0" y="0" width="175" height="212" rx="10" fill="#171922" stroke="#242836" stroke-width="2"/>
      
      <!-- Nav Header Tag -->
      <rect x="14" y="16" width="75" height="18" rx="5" fill="#FF2A6D" stroke="#000000" stroke-width="1.5"/>
      <text x="22" y="29" class="neo-font-bold" font-size="9" fill="#FFFFFF">NAV RAIL</text>

      <!-- Sidebar Item Bars -->
      <rect x="14" y="46" width="135" height="10" rx="4" fill="#242836"/>
      <rect x="14" y="66" width="105" height="10" rx="4" fill="#242836"/>
      <rect x="14" y="86" width="125" height="10" rx="4" fill="#242836"/>
      <rect x="14" y="106" width="90" height="10" rx="4" fill="#242836"/>
      <rect x="14" y="126" width="130" height="10" rx="4" fill="#242836"/>
      
      <rect x="14" y="152" width="75" height="12" rx="4" fill="#72A4F2" opacity="0.8"/>
      <rect x="14" y="174" width="115" height="10" rx="4" fill="#242836"/>
    </g>

    <!-- 2. Main Content Canvas (Expands Smoothly to Fill Space) -->
    <g transform="translate(195, 0)">
      <g class="anim-content">
        <!-- Content Card Background -->
        <rect x="0" y="0" width="585" height="212" rx="12" fill="#171922" stroke="#242836" stroke-width="2"/>

        <!-- Eyebrow Badge -->
        <rect x="22" y="18" width="130" height="20" rx="6" fill="#05FFA1" stroke="#000000" stroke-width="1.5"/>
        <text x="30" y="32" class="neo-font-bold" font-size="9.5" fill="#000000" letter-spacing="0.5">CLEAN READING</text>

        <!-- Article Headline -->
        <text x="22" y="64" class="neo-font-bold" font-size="18" fill="#F4F0E4">Distraction-Free Reading Mode</text>

        <!-- Article Text Lines (Strict Pixel Widths - Zero Overflow Glitches) -->
        <rect x="22" y="80" width="480" height="9" rx="4" fill="#242836"/>
        <rect x="22" y="98" width="510" height="9" rx="4" fill="#242836"/>
        <rect x="22" y="116" width="430" height="9" rx="4" fill="#242836"/>
        <rect x="22" y="134" width="465" height="9" rx="4" fill="#242836"/>

        <!-- Stat Badges (Neo-Brutalist) -->
        <g transform="translate(22, 160)">
          <rect x="0" y="0" width="115" height="34" rx="8" fill="#FF2A6D" stroke="#000000" stroke-width="1.8"/>
          <text x="12" y="18" class="neo-font-bold" font-size="13" fill="#FFFFFF">+45%</text>
          <text x="56" y="18" class="neo-font-sans" font-size="10" fill="#FFFFFF" opacity="0.9">Space</text>
          <text x="12" y="29" class="neo-font-sans" font-size="8" fill="#FFFFFF" opacity="0.8">Reclaimed</text>

          <rect x="130" y="0" width="130" height="34" rx="8" fill="#F4F0E4" stroke="#000000" stroke-width="1.8"/>
          <text x="142" y="18" class="neo-font-bold" font-size="13" fill="#000000">0ms</text>
          <text x="178" y="18" class="neo-font-sans" font-size="10" fill="#000000" opacity="0.85">Lag</text>
          <text x="142" y="29" class="neo-font-sans" font-size="8" fill="#000000" opacity="0.75">Instant Flow</text>

          <rect x="275" y="0" width="145" height="34" rx="8" fill="#72A4F2" stroke="#000000" stroke-width="1.8"/>
          <text x="287" y="18" class="neo-font-bold" font-size="13" fill="#000000">0</text>
          <text x="303" y="18" class="neo-font-sans" font-size="10" fill="#000000" opacity="0.85">Scrollbars</text>
          <text x="287" y="29" class="neo-font-sans" font-size="8" fill="#000000" opacity="0.75">Pure Focus</text>
        </g>
      </g>
    </g>

    <!-- 3. Vertical Scrollbar (Smoothly Fades to Zero on the Right) -->
    <g class="anim-scrollbar" transform="translate(784, 8)">
      <rect x="0" y="0" width="8" height="196" rx="4" fill="#1C1D20"/>
      <rect x="1" y="26" width="6" height="52" rx="3" fill="#FF2A6D"/>
    </g>
  </g>
</svg>
