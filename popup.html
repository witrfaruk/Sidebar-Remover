<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar Remover</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand-icon">
        <img src="icons/icon48.png" alt="Sidebar Remover" width="24" height="24" />
      </div>
      <div class="header-text">
        <h1 class="brand-title">Sidebar Remover</h1>
        <p class="brand-subtitle">A cleaner, distraction-free web</p>
      </div>
    </header>

    <!-- Main View -->
    <main class="view active" id="mainView">
      <div class="toggle-card">
        <!-- Toggle: Hide scrollbars -->
        <label class="toggle-item" for="scrollToggle">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="5" y="2" width="14" height="20" rx="7"></rect>
              <line x1="12" y1="6" x2="12" y2="10"></line>
            </svg>
            <span class="toggle-text">Hide scrollbars</span>
          </div>
          <span class="switch">
            <input type="checkbox" id="scrollToggle" checked aria-label="Hide scrollbars" />
            <span class="slider"></span>
          </span>
        </label>

        <div class="card-divider"></div>

        <!-- Toggle: Hide sidebar -->
        <label class="toggle-item" for="sidebarToggle">
          <div class="toggle-info">
            <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"></rect>
              <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
            <span class="toggle-text">Hide sidebar</span>
          </div>
          <span class="switch">
            <input type="checkbox" id="sidebarToggle" aria-label="Hide sidebar" />
            <span class="slider"></span>
          </span>
        </label>
      </div>

      <!-- Settings Button -->
      <button type="button" class="settings-btn" id="openSettingsBtn" aria-label="Settings">
        <div class="settings-btn-content">
          <svg class="gear-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
          <span>Settings</span>
        </div>
        <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </main>

    <!-- Settings View -->
    <main class="view" id="settingsView">
      <div class="settings-nav-header">
        <button type="button" class="back-btn" id="closeSettingsBtn" aria-label="Back to main">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <span class="settings-title">Settings</span>
      </div>

      <div class="toggle-card">
        <!-- Setting 1: Hide sidebar by default -->
        <label class="toggle-item" for="defaultSidebarToggle">
          <div class="toggle-info">
            <span class="toggle-text">Hide sidebar by default</span>
          </div>
          <span class="switch">
            <input type="checkbox" id="defaultSidebarToggle" aria-label="Hide sidebar by default" />
            <span class="slider"></span>
          </span>
        </label>

        <div class="card-divider"></div>

        <!-- Setting 2: Hide scrollbar by default -->
        <label class="toggle-item" for="defaultScrollToggle">
          <div class="toggle-info">
            <span class="toggle-text">Hide scrollbar by default</span>
          </div>
          <span class="switch">
            <input type="checkbox" id="defaultScrollToggle" checked aria-label="Hide scrollbar by default" />
            <span class="slider"></span>
          </span>
        </label>
      </div>
    </main>

    <!-- Footer: Made by WitrFaruk + Buy me a coffee -->
    <footer class="popup-footer">
      <a href="https://witrfaruk.vercel.app" target="_blank" rel="noopener noreferrer" class="made-by-link">
        <span class="heart-icon">❤️</span>
        <span>Made by WitrFaruk</span>
      </a>
      <a href="https://buymeacoffee.com/witrfaruk" target="_blank" rel="noopener noreferrer" class="coffee-btn">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM4 19h16v2H4z"/>
        </svg>
        <span>Buy me a coffee</span>
      </a>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
